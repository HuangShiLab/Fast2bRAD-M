[package]
name = "f2brad-m"
version = "0.1.0"
edition = "2021"
authors = ["ZHANG Yufeng"]
description = "Microbial taxonomic profiling pipeline (Fast2bRAD-M)"

[[bin]]
name = "fast2bRAD-M"
path = "src/main.rs"

[dependencies]
f2brad-core = { path = "../f2brad-core" }

anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
structopt = "0.3"
tikv-jemallocator = "0.6"
tracing-appender = "0.2"

fxhash = "0.2"
rayon = "1.8"
ndarray = "0.15"
regex = "1"

needletail = "0.5"
flate2 = "1.0"
zstd = "0.13"

ort = { version = "2.0.0-rc.12", features = ["ndarray"] }

tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"

csv = "1.3"
